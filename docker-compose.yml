version: '3.9'

# ============================================================
# CINESTATE — Docker Compose
# Stack: ClickHouse + AI Service + Backend + Frontend
# NO MONGODB — ClickHouse is the primary database
# ============================================================

services:
  # ── ClickHouse (Primary Database) ────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.6
    container_name: cinestate_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface (used by clients)
      - "9000:9000"   # Native TCP (optional)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: cinestate
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── AI Service (FastAPI + ADK + Gemini) ──────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cinestate_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: cinestate
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - ./uploads:/app/uploads
      - ./demo-data:/app/demo-data:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # ── Backend API (Node.js + Express) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinestate_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: cinestate
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      clickhouse:
        condition: service_healthy
      ai-service:
        condition: service_started

  # ── Frontend (React + Vite) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    container_name: cinestate_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  clickhouse_data:
